name = "studyplanner-api"
main = "src/main.py"
# Pyodide and the Python Workers runtime are selected by this date. Do not raise
# it without re-running the check below.
#
# Raising it to 2026-04-01 was tried as a candidate fix for cloudflare/workerd#6624
# (the GIL fault behind the production 500s — see docs/load-test-2026-08.md) and
# reverted: on a cold `wrangler dev --remote` every request failed 500 with
#   PythonWorkersInternalError: Received non-dedicated snapshot but compat flag
#   for dedicated snapshots is enabled
# 60/60 requests, no exceptions. It also flips entrypoint dispatch, so local
# `wrangler dev` then wants `fetch` where the deployed runtime wants `on_fetch`.
compatibility_date = "2025-05-20"
compatibility_flags = ["python_workers"]
workers_dev = true

[triggers]
# Daily at 03:17 UTC. Keep one cleanup invocation so all retention deletes
# succeed or roll back together.
crons = ["17 3 * * *"]

[vars]
ENVIRONMENT = "production"
ALLOWED_ORIGINS = "https://studyplaner.pages.dev,https://*.studyplaner.pages.dev,http://localhost:5173"
AUTH_TOKEN_TTL_SECONDS = "2592000"
# Operators listed here can inspect aggregated client errors from every account.
DIAGNOSTICS_ADMIN_USERNAMES = "test"

[secrets]
# Declaring the name makes deployment fail closed when the production signing
# secret is missing. The value remains a Cloudflare secret and is never stored here.
required = ["AUTH_TOKEN_SECRET"]

# Active runtime D1 for the current deployed app.
# studyplanner-db is the approved production database (multi-period ALMA catalog, integrate_new_db cutover).
# The database name and id are public Cloudflare binding config; AUTH_TOKEN_SECRET stays a Worker secret.
[[d1_databases]]
binding = "DB"
database_name = "studyplanner-db"
database_id = "80ca9092-ddc6-454a-b04a-8ccae85ef2f5"
