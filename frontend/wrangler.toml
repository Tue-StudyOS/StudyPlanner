# Cloudflare Pages project config.
# VITE_API_BASE_URL is public build-time config, not a secret.
name = "studyplaner"
pages_build_output_dir = "dist"
compatibility_date = "2026-05-21"

# apiBaseUrl.ts uses VITE_API_BASE_URL when present, otherwise same-origin on
# deployed hosts. A plain Vite build does not read this Wrangler configuration;
# set the build environment explicitly (see docs/cloudflare-setup.md).
[vars]
VITE_API_BASE_URL = "https://studyplanner-api.ben-tischberger.workers.dev"

[env.production.vars]
# Use explicit Worker origins in production. Service bindings are kept below as
# fallback config, but Python Workers currently hang when invoked through the
# Pages service binding path.
VITE_API_BASE_URL = "https://studyplanner-api.ben-tischberger.workers.dev"
STUDYPLANNER_API_ORIGIN = "https://studyplanner-api.ben-tischberger.workers.dev"

[[services]]
binding = "STUDYPLANNER_API"
service = "studyplanner-api"

[[services]]
binding = "STUDYPLANNER_MCP"
service = "studyplanner-mcp"

[[env.production.services]]
binding = "STUDYPLANNER_API"
service = "studyplanner-api"

[[env.production.services]]
binding = "STUDYPLANNER_MCP"
service = "studyplanner-mcp"
