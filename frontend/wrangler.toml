# Cloudflare Pages project config.
# VITE_API_BASE_URL is public build-time config, not a secret. Deployed browsers
# ignore it and call same-origin /api/* so Safari/iOS can store the session cookie.
name = "studyplaner"
pages_build_output_dir = "dist"
compatibility_date = "2026-05-21"

# Localhost Vite override only. Deployed hosts ignore this and call same-origin
# /api/* so Safari/iOS can store the session cookie. A plain Vite build does not
# read this Wrangler configuration; see docs/cloudflare-setup.md.
[vars]
VITE_API_BASE_URL = "https://studyplanner-api.ben-tischberger.workers.dev"

[env.production.vars]
# STUDYPLANNER_API_ORIGIN is the HTTP hop used by functions/api/[[path]].ts.
# VITE_API_BASE_URL stays as a local-dev override; apiBaseUrl.ts ignores it on
# deployed hosts so the session cookie is first-party on the Pages origin.
VITE_API_BASE_URL = "https://studyplanner-api.ben-tischberger.workers.dev"
STUDYPLANNER_API_ORIGIN = "https://studyplanner-api.ben-tischberger.workers.dev"

[[services]]
binding = "STUDYPLANNER_API"
service = "studyplanner-api"

[[services]]
binding = "STUDYPLANNER_MCP"
service = "studyplanner-mcp"

[[env.production.services]]
binding = "STUDYPLANNER_API"
service = "studyplanner-api"

[[env.production.services]]
binding = "STUDYPLANNER_MCP"
service = "studyplanner-mcp"
